<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Approval-gated avatar IP production</title>
  <desc id="desc">Six approval stages validate one anchor persona before expanding the cast, modules, scenes, and motion.</desc>
  <defs>
    <linearGradient id="bg04e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1322"/><stop offset="1" stop-color="#182942"/></linearGradient>
    <linearGradient id="pill04e" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72e8ff"/><stop offset="1" stop-color="#84a7ff"/></linearGradient>
    <filter id="shadow04e" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#02050a" flood-opacity=".3"/></filter>
    <style>.t{font:700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fbff}.s{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aebbd0}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.b{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd6e8}.p{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#101a2d}.n{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dce8ff}</style>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg04e)"/>
  <text x="72" y="82" class="t">Approval-gated avatar IP production</text><text x="72" y="122" class="s">Lock one anchor persona before expanding the cast, outfits, scenes, or motion.</text>
  <g filter="url(#shadow04e)"><rect x="72" y="190" width="196" height="278" rx="24" fill="#202b45" stroke="#3c4e70"/><rect x="292" y="174" width="196" height="310" rx="24" fill="#1c3659" stroke="#59b8ff" stroke-width="3"/><rect x="512" y="190" width="196" height="278" rx="24" fill="#202b45" stroke="#3c4e70"/><rect x="732" y="190" width="196" height="278" rx="24" fill="#202b45" stroke="#3c4e70"/><rect x="952" y="190" width="196" height="278" rx="24" fill="#202b45" stroke="#3c4e70"/><rect x="1172" y="190" width="196" height="278" rx="24" fill="#202b45" stroke="#3c4e70"/></g>
  <g>
    <text x="96" y="232" class="h">1 · Direction</text><text x="96" y="276" class="b">2–3 distinct style</text><text x="96" y="301" class="b">directions, or one</text><text x="96" y="326" class="b">approved reference</text><rect x="96" y="400" width="148" height="34" rx="17" fill="url(#pill04e)"/><text x="170" y="422" class="p" text-anchor="middle">APPROVE STYLE</text>
    <text x="316" y="216" class="h">2 · Anchor pair</text><text x="316" y="260" class="b">Identity source</text><text x="316" y="285" class="b">+ neutral base</text><text x="316" y="310" class="b">+ signature look</text><line x1="316" y1="332" x2="464" y2="332" stroke="#4c6c94"/><text x="316" y="360" class="b">Identity · body · outfit</text><rect x="316" y="418" width="148" height="34" rx="17" fill="#69efd0"/><text x="390" y="440" class="p" text-anchor="middle">AXIS RECEIPT</text>
    <text x="536" y="232" class="h">3 · Cast</text><text x="536" y="276" class="b">Persona identities</text><text x="536" y="301" class="b">+ body contracts</text><text x="536" y="326" class="b">+ scale review</text><rect x="536" y="400" width="148" height="34" rx="17" fill="url(#pill04e)"/><text x="610" y="422" class="p" text-anchor="middle">APPROVE CAST</text>
    <text x="756" y="232" class="h">4 · Modules</text><text x="756" y="276" class="b">Signature outfit first</text><text x="756" y="301" class="b">then palettes, props,</text><text x="756" y="326" class="b">wearables and</text><text x="756" y="351" class="b">combinations</text><rect x="756" y="400" width="148" height="34" rx="17" fill="url(#pill04e)"/><text x="830" y="422" class="p" text-anchor="middle">APPROVE SYSTEM</text>
    <text x="976" y="232" class="h">5 · Scenes</text><text x="976" y="276" class="b">Transparent subject</text><text x="976" y="301" class="b">+ editable background</text><text x="976" y="326" class="b">+ composed preview</text><rect x="976" y="400" width="148" height="34" rx="17" fill="url(#pill04e)"/><text x="1050" y="422" class="p" text-anchor="middle">APPROVE SCENES</text>
    <text x="1196" y="232" class="h">6 · Motion</text><text x="1196" y="276" class="b">One loop first</text><text x="1196" y="301" class="b">then batch</text><text x="1196" y="326" class="b">+ technical QA</text><rect x="1196" y="400" width="148" height="34" rx="17" fill="url(#pill04e)"/><text x="1270" y="422" class="p" text-anchor="middle">APPROVE SAMPLE</text>
  </g>
  <g stroke="#7f98bf" stroke-width="4" fill="none"><path d="M268 329h24"/><path d="M488 329h24"/><path d="M708 329h24"/><path d="M928 329h24"/><path d="M1148 329h24"/></g><g fill="#7f98bf"><path d="M284 321l12 8-12 8z"/><path d="M504 321l12 8-12 8z"/><path d="M724 321l12 8-12 8z"/><path d="M944 321l12 8-12 8z"/><path d="M1164 321l12 8-12 8z"/></g>
  <rect x="72" y="548" width="1296" height="266" rx="26" fill="#121d30" stroke="#2e4668"/><text x="104" y="594" class="h">What the anchor-pair gate prevents</text>
  <circle cx="120" cy="638" r="8" fill="#ff7c8b"/><text x="144" y="643" class="n">A front view can be correct while the person is wrong</text>
  <circle cx="120" cy="686" r="8" fill="#ffcf6a"/><text x="144" y="691" class="n">A plain base T-shirt can be mistaken for the final fashion direction</text>
  <circle cx="120" cy="734" r="8" fill="#83dcff"/><text x="144" y="739" class="n">A loose outfit label can overwrite the signature silhouette and color hierarchy</text>
  <line x1="820" y1="620" x2="820" y2="762" stroke="#2e4668"/><text x="862" y="650" class="b">No cast expansion</text><text x="862" y="690" class="b">No modular matrix</text><text x="862" y="730" class="b">No paid motion batch</text>
  <rect x="1136" y="626" width="184" height="112" rx="20" fill="#263b5d" stroke="#69efd0"/><text x="1228" y="672" class="h" text-anchor="middle">Until both views</text><text x="1228" y="704" class="h" text-anchor="middle">are approved</text>
</svg>
