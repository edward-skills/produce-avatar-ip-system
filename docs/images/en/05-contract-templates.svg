<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Reusable production contracts</title><desc id="desc">Four structured contracts connect reference roles, persona identity, approval scope, and modular assets.</desc>
  <defs><linearGradient id="bg05e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fd"/><stop offset="1" stop-color="#e8eef8"/></linearGradient><filter id="shadow05e" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#27334a" flood-opacity=".16"/></filter><style>.t{font:700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15213a}.s{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596983}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.f{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#52627a}.k{font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1764b7}.v{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#40506a}.n{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52627a}</style></defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg05e)"/><text x="72" y="82" class="t">Four contracts that reduce repeated correction</text><text x="72" y="122" class="s">Every approval has explicit sources, immutable identity, visible axes, and a next action.</text>
  <g filter="url(#shadow05e)"><rect x="72" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="402" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="732" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="1062" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/></g>
  <g>
    <text x="98" y="232" class="h">01 · Reference roles</text><rect x="98" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="225" y="274" class="f" text-anchor="middle">reference-role-map.yaml</text><text x="98" y="326" class="k">identity_source</text><text x="98" y="350" class="v">Exact person</text><text x="98" y="390" class="k">style_source</text><text x="98" y="414" class="v">Material and rendering language</text><text x="98" y="454" class="k">composition_source</text><text x="98" y="478" class="v">Camera, proportion, and crop only</text><text x="98" y="518" class="k">signature_look_source</text><text x="98" y="542" class="v">Outfit, accessories, and attitude</text><line x1="98" y1="584" x2="352" y2="584" stroke="#d9e1ed"/><text x="98" y="622" class="n">Stops a composition reference</text><text x="98" y="647" class="n">from replacing the person's face.</text>
    <text x="428" y="232" class="h">02 · Persona contract</text><rect x="428" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="555" y="274" class="f" text-anchor="middle">persona-contract.yaml</text><text x="428" y="326" class="k">immutable_identity</text><text x="428" y="350" class="v">Eyes · nose · mouth</text><text x="428" y="376" class="v">Face · skin · hair</text><text x="428" y="424" class="k">body_construction</text><text x="428" y="448" class="v">Chest · shoulders · torso</text><text x="428" y="474" class="v">Neck · scale · garment drape</text><text x="428" y="522" class="k">signature_look</text><text x="428" y="546" class="v">Silhouette · layers · accessories</text><text x="428" y="572" class="v">Color areas · material · hardware</text><line x1="428" y1="612" x2="682" y2="612" stroke="#d9e1ed"/><text x="428" y="650" class="n">Locks identity, body construction,</text><text x="428" y="675" class="n">and final styling separately.</text>
    <text x="758" y="232" class="h">03 · Approval receipt</text><rect x="758" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="885" y="274" class="f" text-anchor="middle">approval-receipt.yaml</text><text x="758" y="326" class="k">reviewed_assets</text><text x="758" y="350" class="v">Source + current candidates</text><text x="758" y="398" class="k">axes</text><text x="758" y="422" class="v">Identity: approved</text><text x="758" y="448" class="v">Composition: pending</text><text x="758" y="474" class="v">Signature look: retry</text><text x="758" y="522" class="k">next_allowed_action</text><text x="758" y="546" class="v">One scoped correction</text><line x1="758" y1="584" x2="1012" y2="584" stroke="#d9e1ed"/><text x="758" y="622" class="n">“OK” no longer approves every</text><text x="758" y="647" class="n">asset and downstream stage.</text>
    <text x="1088" y="232" class="h">04 · Modular system</text><rect x="1088" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="1215" y="274" class="f" text-anchor="middle">modular-system-contract.yaml</text><text x="1088" y="326" class="k">signature_outfit</text><text x="1088" y="350" class="v">Reconstruct the source first</text><text x="1088" y="398" class="k">palette_area_roles</text><text x="1088" y="422" class="v">Dominant · secondary · accent</text><text x="1088" y="448" class="v">Emission and material areas</text><text x="1088" y="496" class="k">derived_outfits</text><text x="1088" y="520" class="v">Expand only after approval</text><text x="1088" y="568" class="k">representative_matrix</text><text x="1088" y="592" class="v">Small sample before batching</text><line x1="1088" y1="626" x2="1342" y2="626" stroke="#d9e1ed"/><text x="1088" y="664" class="n">Every combination starts from</text><text x="1088" y="689" class="n">approved modules.</text>
  </g>
  <g stroke="#8296b4" stroke-width="4" fill="none"><path d="M378 464h24"/><path d="M708 464h24"/><path d="M1038 464h24"/></g><g fill="#8296b4"><path d="M394 456l12 8-12 8z"/><path d="M724 456l12 8-12 8z"/><path d="M1054 456l12 8-12 8z"/></g><rect x="72" y="786" width="1296" height="48" rx="24" fill="#17243a"/><text x="720" y="817" text-anchor="middle" style="font:650 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Source roles → stable person → explicit approval → controlled expansion</text>
</svg>
