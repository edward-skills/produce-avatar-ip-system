<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proportion and body construction templates</title><desc id="desc">Non-character diagrams show independently selectable head-to-body proportions and upper-body geometry.</desc><rect width="1440" height="900" rx="32" fill="#f4f5fb"/><text x="72" y="76" fill="#15182d" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Construction templates are measurements, not fixed faces</text><text x="72" y="118" fill="#5e6684" font-family="Inter,Arial,sans-serif" font-size="20">Choose proportion and body geometry independently, then apply an approved identity.</text><text x="72" y="182" fill="#273051" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">HEAD / VISIBLE BODY PROPORTION</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g transform="translate(160 230)"><rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/><circle cx="125" cy="92" r="63" fill="#8a73ff" opacity=".88"/><path d="M68 183Q125 143 182 183L207 303H43Z" fill="#2b3762"/><line x1="34" y1="155" x2="216" y2="155" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/><text x="125" y="280" fill="#fff" font-size="16">42–48%</text><text x="125" y="365" fill="#202640" font-size="18" font-weight="700">Balanced stylized</text></g><g transform="translate(450 230)"><rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/><circle cx="125" cy="104" r="78" fill="#6b8cff" opacity=".9"/><path d="M74 204Q125 169 176 204L197 303H53Z" fill="#2b3762"/><line x1="35" y1="183" x2="215" y2="183" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/><text x="125" y="280" fill="#fff" font-size="16">50–56%</text><text x="125" y="365" fill="#202640" font-size="18" font-weight="700">Cute large head</text></g><g transform="translate(740 230)"><rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/><circle cx="125" cy="108" r="92" fill="#a36cff" opacity=".9"/><path d="M82 228Q125 198 168 228L185 303H65Z" fill="#2b3762"/><line x1="35" y1="208" x2="215" y2="208" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/><text x="125" y="280" fill="#fff" font-size="16">58–66%</text><text x="125" y="365" fill="#202640" font-size="18" font-weight="700">Q chibi</text></g><g transform="translate(1030 230)"><rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/><circle cx="125" cy="73" r="49" fill="#5977c9" opacity=".9"/><path d="M56 155Q125 111 194 155L219 303H31Z" fill="#2b3762"/><line x1="27" y1="130" x2="223" y2="130" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/><text x="125" y="280" fill="#fff" font-size="16">34–40%</text><text x="125" y="365" fill="#202640" font-size="18" font-weight="700">Semi-real</text></g></g>
  <text x="72" y="652" fill="#273051" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">BODY CONSTRUCTION — SELECTED SEPARATELY FROM GENDER PRESENTATION</text><g font-family="Inter,Arial,sans-serif"><rect x="72" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/><path d="M116 720h62l18 66H98Z" fill="#53648f"/><text x="218" y="733" fill="#202640" font-size="18" font-weight="700">Compact neutral</text><text x="218" y="758" fill="#5e6684" font-size="14">compact-neutral</text><text x="218" y="782" fill="#5e6684" font-size="14">quiet chest</text><text x="218" y="802" fill="#5e6684" font-size="14">balanced shoulders</text><rect x="402" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/><path d="M446 720h66l8 66h-82Z" fill="#53648f"/><text x="548" y="733" fill="#202640" font-size="18" font-weight="700">Flat and straight</text><text x="548" y="758" fill="#5e6684" font-size="14">flat-straight</text><text x="548" y="782" fill="#5e6684" font-size="14">straight tee drape</text><text x="548" y="802" fill="#5e6684" font-size="14">no bust curve</text><rect x="732" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/><path d="M778 720h62q10 28 16 66h-94q6-38 16-66Z" fill="#53648f"/><text x="878" y="733" fill="#202640" font-size="18" font-weight="700">Soft curved</text><text x="878" y="758" fill="#5e6684" font-size="14">soft-curved</text><text x="878" y="782" fill="#5e6684" font-size="14">natural volume</text><text x="878" y="802" fill="#5e6684" font-size="14">not exaggerated</text><rect x="1062" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/><path d="M1104 720h88l-3 66h-82Z" fill="#53648f"/><text x="1216" y="733" fill="#202640" font-size="18" font-weight="700">Broad athletic</text><text x="1216" y="758" fill="#5e6684" font-size="14">broad-athletic</text><text x="1216" y="782" fill="#5e6684" font-size="14">level shoulders</text><text x="1216" y="802" fill="#5e6684" font-size="14">no bodybuilder bulk</text></g><text x="72" y="866" fill="#5e6684" font-family="Inter,Arial,sans-serif" font-size="17">Same identity + same proportion + explicit body geometry = consistent cast construction.</text>
</svg>
