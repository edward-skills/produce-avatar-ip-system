<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Composable IP character template stack</title><desc id="desc">A user idea is translated into independently selected parameters and stage-specific prompt contracts.</desc>
  <defs><linearGradient id="bg06e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1024"/><stop offset="1" stop-color="#171238"/></linearGradient><linearGradient id="accent06e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47d7ff"/><stop offset="1" stop-color="#9568ff"/></linearGradient><filter id="shadow06e"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter></defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg06e)"/><text x="80" y="82" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">IP template = composable parameters, not a fixed character</text><text x="80" y="124" fill="#aeb9db" font-family="Inter,Arial,sans-serif" font-size="21">Any agent can resolve the same selection IDs into the same stage contract.</text>
  <g filter="url(#shadow06e)"><rect x="80" y="182" width="250" height="566" rx="28" fill="#171d3a" stroke="#34426f"/><rect x="1110" y="182" width="250" height="566" rx="28" fill="#171d3a" stroke="#34426f"/></g>
  <text x="115" y="236" fill="#63ddff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">USER IDEA</text><text x="115" y="292" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">“Cute, cool,</text><text x="115" y="330" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">trendy, less</text><text x="115" y="368" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">human-like”</text><line x1="115" y1="414" x2="295" y2="414" stroke="#34426f"/><text x="115" y="457" fill="#aeb9db" font-family="Inter,Arial,sans-serif" font-size="18">The idea becomes</text><text x="115" y="484" fill="#aeb9db" font-family="Inter,Arial,sans-serif" font-size="18">explicit controls.</text><text x="115" y="541" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18">No hidden assumptions</text><text x="115" y="570" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18">about anatomy, outfit,</text><text x="115" y="599" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18">gender, or camera.</text>
  <g font-family="Inter,Arial,sans-serif"><text x="390" y="178" fill="#fff" font-size="22" font-weight="700">INDEPENDENT TEMPLATE DIMENSIONS</text><text x="1020" y="198" fill="#9da9cd" font-size="14" text-anchor="end">lowercase strings are stable IDs</text><g fill="#20294d" stroke="#495987"><rect x="390" y="216" width="300" height="82" rx="18"/><rect x="720" y="216" width="300" height="82" rx="18"/><rect x="390" y="318" width="300" height="82" rx="18"/><rect x="720" y="318" width="300" height="82" rx="18"/><rect x="390" y="420" width="300" height="82" rx="18"/><rect x="720" y="420" width="300" height="82" rx="18"/><rect x="390" y="522" width="300" height="82" rx="18"/><rect x="720" y="522" width="300" height="82" rx="18"/><rect x="390" y="624" width="300" height="82" rx="18"/><rect x="720" y="624" width="300" height="82" rx="18"/></g><g fill="#7ce4ff" font-size="16" font-weight="700"><text x="416" y="247">STYLE</text><text x="746" y="247">PROPORTION</text><text x="416" y="349">PRESENTATION</text><text x="746" y="349">BODY CONSTRUCTION</text><text x="416" y="451">FACE SHAPE</text><text x="746" y="451">HAIR SILHOUETTE</text><text x="416" y="553">OUTFIT</text><text x="746" y="553">WEARABLE + PROP</text><text x="416" y="655">PALETTE</text><text x="746" y="655">COMPOSITION</text></g><g fill="#fff" font-size="17"><text x="416" y="276">cute-collectible-3d</text><text x="746" y="276">cute-large-head-upper-body</text><text x="416" y="378">androgynous-neutral</text><text x="746" y="378">compact-neutral</text><text x="416" y="480">rounded-square</text><text x="746" y="480">sculpted-bob-undercut</text><text x="416" y="582">neo-street-tech</text><text x="746" y="582">none / none</text><text x="416" y="684">cobalt-ultraviolet</text><text x="746" y="684">neutral-front-upper-body</text></g></g>
  <path d="M335 465H373" stroke="url(#accent06e)" stroke-width="6" stroke-linecap="round"/><path d="M366 454l14 11-14 11" fill="none" stroke="#7ce4ff" stroke-width="5"/><path d="M1038 465h54" stroke="url(#accent06e)" stroke-width="6" stroke-linecap="round"/><path d="M1085 454l14 11-14 11" fill="none" stroke="#9c75ff" stroke-width="5"/>
  <text x="1144" y="236" fill="#9c75ff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">STAGE RESOLVER</text><g font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle"><rect x="1144" y="272" width="182" height="58" rx="14" fill="#242b50"/><text x="1235" y="308" fill="#fff">Concept direction</text><rect x="1144" y="348" width="182" height="72" rx="14" fill="#193b52" stroke="#47d7ff"/><text x="1235" y="378" fill="#fff">Neutral base</text><text x="1235" y="402" fill="#80e7ff" font-size="14">forces tee + front</text><rect x="1144" y="438" width="182" height="58" rx="14" fill="#242b50"/><text x="1235" y="474" fill="#fff">Signature look</text><rect x="1144" y="514" width="182" height="58" rx="14" fill="#242b50"/><text x="1235" y="550" fill="#fff">Complete system</text><rect x="1144" y="590" width="182" height="58" rx="14" fill="#242b50"/><text x="1235" y="626" fill="#fff">Scene + motion</text></g><rect x="1144" y="675" width="182" height="42" rx="21" fill="url(#accent06e)"/><text x="1235" y="702" fill="#0c1024" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle">PROMPT RECEIPT</text><text x="80" y="827" fill="#aeb9db" font-family="Inter,Arial,sans-serif" font-size="18">Change one ID → review one axis → keep approved identity and every other ID locked.</text>
</svg>
