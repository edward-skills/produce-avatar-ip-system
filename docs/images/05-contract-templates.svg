<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">可复用的制作合同模板</title>
  <desc id="desc">四份结构化模板依次连接引用角色、人物身份、审批范围和模块资产。</desc>
  <defs>
    <linearGradient id="bg05" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fd"/><stop offset="1" stop-color="#e8eef8"/></linearGradient>
    <filter id="shadow05" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#27334a" flood-opacity=".16"/></filter>
    <style>
      .t05{font:700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15213a}.s05{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596983}.h05{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}.f05{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#52627a}.k05{font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1764b7}.v05{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#40506a}.n05{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52627a}
    </style>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg05)"/>
  <text x="72" y="82" class="t05">减少反复修改的四类制作合同</text><text x="72" y="122" class="s05">每次确认都有明确的来源、不可变身份、审批轴和下一步动作。</text>
  <g filter="url(#shadow05)">
    <rect x="72" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="402" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="732" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/><rect x="1062" y="190" width="306" height="548" rx="24" fill="#fff" stroke="#e0e5ef"/>
  </g>
  <g>
    <text x="98" y="232" class="h05">01 · 引用角色</text><rect x="98" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="225" y="274" class="f05" text-anchor="middle">reference-role-map.yaml</text>
    <text x="98" y="326" class="k05">identity_source</text><text x="98" y="350" class="v05">精确人物身份</text><text x="98" y="390" class="k05">style_source</text><text x="98" y="414" class="v05">材质与渲染语言</text><text x="98" y="454" class="k05">composition_source</text><text x="98" y="478" class="v05">仅镜头、比例与裁切</text><text x="98" y="518" class="k05">signature_look_source</text><text x="98" y="542" class="v05">标志性穿搭、配饰与态度</text><line x1="98" y1="584" x2="352" y2="584" stroke="#d9e1ed"/><text x="98" y="622" class="n05">防止构图参考替换人物脸，</text><text x="98" y="648" class="n05">也防止服装参考改写身份。</text>
    <text x="428" y="232" class="h05">02 · 人物合同</text><rect x="428" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="555" y="274" class="f05" text-anchor="middle">persona-contract.yaml</text>
    <text x="428" y="326" class="k05">immutable_identity</text><text x="428" y="350" class="v05">眼睛 · 鼻子 · 嘴巴</text><text x="428" y="376" class="v05">脸型 · 肤色 · 发型</text><text x="428" y="424" class="k05">body_construction</text><text x="428" y="448" class="v05">胸廓 · 肩宽 · 躯干</text><text x="428" y="474" class="v05">颈部 · 头身比 · 衣物垂坠</text><text x="428" y="522" class="k05">signature_look</text><text x="428" y="546" class="v05">轮廓 · 层次 · 配饰</text><text x="428" y="572" class="v05">配色面积 · 材质 · 五金</text><line x1="428" y1="612" x2="682" y2="612" stroke="#d9e1ed"/><text x="428" y="650" class="n05">把人物身份、身体结构和</text><text x="428" y="676" class="n05">最终造型分开锁定。</text>
    <text x="758" y="232" class="h05">03 · 审批回执</text><rect x="758" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="885" y="274" class="f05" text-anchor="middle">approval-receipt.yaml</text>
    <text x="758" y="326" class="k05">reviewed_assets</text><text x="758" y="350" class="v05">来源图 + 当前候选图</text><text x="758" y="398" class="k05">axes</text><text x="758" y="422" class="v05">身份：已确认</text><text x="758" y="448" class="v05">构图：待确认</text><text x="758" y="474" class="v05">标志造型：需重做</text><text x="758" y="522" class="k05">next_allowed_action</text><text x="758" y="546" class="v05">只允许一次定向修改</text><line x1="758" y1="584" x2="1012" y2="584" stroke="#d9e1ed"/><text x="758" y="622" class="n05">“OK” 不再被解释成对</text><text x="758" y="648" class="n05">所有资产和阶段的确认。</text>
    <text x="1088" y="232" class="h05">04 · 模块系统</text><rect x="1088" y="252" width="254" height="34" rx="17" fill="#edf3fb"/><text x="1215" y="274" class="f05" text-anchor="middle">modular-system-contract.yaml</text>
    <text x="1088" y="326" class="k05">signature_outfit</text><text x="1088" y="350" class="v05">先精确还原标志性穿搭</text><text x="1088" y="398" class="k05">palette_area_roles</text><text x="1088" y="422" class="v05">主色 · 辅色 · 强调色</text><text x="1088" y="448" class="v05">发光色与材质面积</text><text x="1088" y="496" class="k05">derived_outfits</text><text x="1088" y="520" class="v05">确认后再扩展新服饰</text><text x="1088" y="568" class="k05">representative_matrix</text><text x="1088" y="592" class="v05">先做小矩阵，再做批量</text><line x1="1088" y1="626" x2="1342" y2="626" stroke="#d9e1ed"/><text x="1088" y="664" class="n05">所有组合都从已确认模块</text><text x="1088" y="690" class="n05">出发，不重新发明人物。</text>
  </g>
  <g stroke="#8296b4" stroke-width="4" fill="none"><path d="M378 464h24"/><path d="M708 464h24"/><path d="M1038 464h24"/></g><g fill="#8296b4"><path d="M394 456l12 8-12 8z"/><path d="M724 456l12 8-12 8z"/><path d="M1054 456l12 8-12 8z"/></g>
  <rect x="72" y="786" width="1296" height="48" rx="24" fill="#17243a"/><text x="720" y="817" text-anchor="middle" style="font:650 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">来源角色 → 稳定人物 → 明确审批 → 可控扩展</text>
</svg>
