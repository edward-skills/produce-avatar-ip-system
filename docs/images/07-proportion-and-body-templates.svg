<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">头身比与身体结构模板</title>
  <desc id="desc">不绑定具体人物的示意图，展示可以独立选择的头身比和上半身结构。</desc>
  <rect width="1440" height="900" rx="32" fill="#f4f5fb"/>
  <text x="72" y="76" fill="#15182d" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">结构模板记录的是比例，不是固定脸</text>
  <text x="72" y="118" fill="#5e6684" font-family="Inter,Arial,sans-serif" font-size="20">先独立选择头身比和身体几何，再应用已确认的人物身份。</text>
  <text x="72" y="182" fill="#273051" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">头部 / 可见身体比例</text>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(160 230)">
      <rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/>
      <circle cx="125" cy="92" r="63" fill="#8a73ff" opacity=".88"/>
      <path d="M68 183Q125 143 182 183L207 303H43Z" fill="#2b3762"/>
      <line x1="34" y1="155" x2="216" y2="155" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="125" y="280" fill="#fff" font-size="16">42–48%</text>
      <text x="125" y="365" fill="#202640" font-size="18" font-weight="700">平衡风格化</text>
    </g>
    <g transform="translate(450 230)">
      <rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/>
      <circle cx="125" cy="104" r="78" fill="#6b8cff" opacity=".9"/>
      <path d="M74 204Q125 169 176 204L197 303H53Z" fill="#2b3762"/>
      <line x1="35" y1="183" x2="215" y2="183" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="125" y="280" fill="#fff" font-size="16">50–56%</text>
      <text x="125" y="365" fill="#202640" font-size="18" font-weight="700">可爱大头</text>
    </g>
    <g transform="translate(740 230)">
      <rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/>
      <circle cx="125" cy="108" r="92" fill="#a36cff" opacity=".9"/>
      <path d="M82 228Q125 198 168 228L185 303H65Z" fill="#2b3762"/>
      <line x1="35" y1="208" x2="215" y2="208" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="125" y="280" fill="#fff" font-size="16">58–66%</text>
      <text x="125" y="365" fill="#202640" font-size="18" font-weight="700">Q 版</text>
    </g>
    <g transform="translate(1030 230)">
      <rect width="250" height="330" rx="24" fill="#fff" stroke="#d7dbeb"/>
      <circle cx="125" cy="73" r="49" fill="#5977c9" opacity=".9"/>
      <path d="M56 155Q125 111 194 155L219 303H31Z" fill="#2b3762"/>
      <line x1="27" y1="130" x2="223" y2="130" stroke="#49bde6" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="125" y="280" fill="#fff" font-size="16">34–40%</text>
      <text x="125" y="365" fill="#202640" font-size="18" font-weight="700">半写实</text>
    </g>
  </g>

  <text x="72" y="652" fill="#273051" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">身体结构 — 与性别呈现分开选择</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="72" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/>
    <path d="M116 720h62l18 66H98Z" fill="#53648f"/><text x="218" y="733" fill="#202640" font-size="18" font-weight="700">紧凑中性</text><text x="218" y="760" fill="#5e6684" font-size="14">compact-neutral</text><text x="218" y="788" fill="#5e6684" font-size="15">平静胸廓 · 均衡肩宽</text>
    <rect x="402" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/>
    <path d="M446 720h66l8 66h-82Z" fill="#53648f"/><text x="548" y="733" fill="#202640" font-size="18" font-weight="700">平胸直筒</text><text x="548" y="760" fill="#5e6684" font-size="14">flat-straight</text><text x="548" y="788" fill="#5e6684" font-size="15">T 恤直落 · 无胸部曲线</text>
    <rect x="732" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/>
    <path d="M778 720h62q10 28 16 66h-94q6-38 16-66Z" fill="#53648f"/><text x="878" y="733" fill="#202640" font-size="18" font-weight="700">柔和曲线</text><text x="878" y="760" fill="#5e6684" font-size="14">soft-curved</text><text x="878" y="788" fill="#5e6684" font-size="15">自然体积 · 不夸张</text>
    <rect x="1062" y="687" width="306" height="128" rx="20" fill="#fff" stroke="#d7dbeb"/>
    <path d="M1104 720h88l-3 66h-82Z" fill="#53648f"/><text x="1216" y="733" fill="#202640" font-size="18" font-weight="700">宽肩运动型</text><text x="1216" y="760" fill="#5e6684" font-size="14">broad-athletic</text><text x="1216" y="788" fill="#5e6684" font-size="15">水平宽肩 · 不健美夸张</text>
  </g>
  <text x="72" y="866" fill="#5e6684" font-family="Inter,Arial,sans-serif" font-size="17">同一人物身份 + 同一头身比 + 明确身体结构 = 统一的角色群结构。</text>
</svg>
