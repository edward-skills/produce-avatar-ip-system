schema_version: "1.0"
prompt_revision: prompt-v2

template_system:
  catalog: brief/ip-template-catalog.snapshot.json
  selection: brief/ip-template-selection-p01.json
  rule: "Resolve stage prompts from independent template IDs; do not treat a sample image as the template."
  dimensions:
    style: cute-collectible-3d
    proportion: cute-large-head-upper-body
    gender_presentation: androgynous-neutral
    body_construction: compact-neutral
    face_shape: rounded-square
    hair: sculpted-bob-undercut
    outfit: neo-street-tech
    wearable: none
    prop: none
    palette: cobalt-ultraviolet
    composition: neutral-front-upper-body

reference_roles:
  identity_source: ""
  style_source: ""
  composition_source: ""
  signature_look_source: ""
  rule: "Secondary references may transfer only their declared role and may never override identity."

style:
  preset: soft-anime-tech-3d
  version: style-v1
  realism: 0.35
  head_body_ratio: "0.42-0.48"
  eye_scale: "1.12-1.22x"
  feature_detail: "simplified nose and mouth, expressive eyes"
  material: "soft polymer skin, soft vinyl optics, tactile fabric"
  geometry: "rounded, clean, continuous sculpt"
  lighting: "bright warm frontal studio key, restrained colored rim"
  expression: "friendly, competent, not childish"
  motion_amplitude: medium-high
  user_facing_controls:
    realism: stylized
    cute_proportion: medium
    fashion_attitude: ""
    trend_axis: []
    color_energy: ""
    material_finish: ""
  negative_style:
    - photoreal pores
    - hard cyberpunk armor
    - baby proportions

identity:
  persona_id: p01
  source_reference: ""
  immutable:
    face_contour: ""
    hair_silhouette: ""
    hair_color: ""
    skin_tone: ""
    eye_brow_shape: ""
    visual_age: ""
  direct_source_required: true
  derivative_as_only_identity_source_forbidden: true

body_construction:
  chest_plane: ""
  shoulder_width_relative_to_head: ""
  torso_taper: ""
  neck_length_width: ""
  arm_thickness: ""
  base_garment_drape: ""

composition:
  aspect_ratio: "1:1"
  crop: upper-body
  camera: front-facing
  anchors_pct:
    hair_crown_y: 5
    eye_line_y: 29.5
    chin_y: 41.5
    shoulder_y: 49.5
    lower_crop_y: 96

background:
  subject_master: transparent
  key_color_if_needed: "#FF00FF"
  plate_reference: ""
  editable_layers:
    - base-fill
    - atmosphere
    - decorative-accents
  baked_into_video: false

wearable:
  design_reference: ""
  geometry_lock: ""
  optical_behavior: ""

outfit:
  design_reference: ""
  construction_lock: ""
  signature_first: true
  signature_silhouette: ""
  signature_layers: []
  signature_accessories: []
  palette_area_roles:
    dominant: ""
    secondary: ""
    accent: ""
    emissive: ""
  prohibited_reinterpretations: []

prop:
  design_reference: ""
  front_back_topology: ""
  grip_logic: ""
  readable_surface: ""

motion:
  duration_seconds: 5
  source_frame: ""
  end_frame: "same-as-source"
  camera: locked
  action_sequence:
    - rest
    - face-body-action
    - prop-interaction
    - synchronized-effect
    - return-to-rest
  audio: silent

negative_constraints:
  - identity drift
  - skin-tone shift
  - camera movement
  - crop change
  - extra or missing fingers
  - prop flip or deformation
  - UI or text mutation
  - watermark
